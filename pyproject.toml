[project]
name = "ErisPulse-CYOA"
version = "1.1.4"
description = "互动小说播放器 — 基于 Ink 的多平台故事引擎（交互式菜单 + 富文本降级 + Dashboard）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "wsu2059q", email = "wsu2059@qq.com" } ]

dependencies = [
    "inkpython>=0.1.0",
    "aiohttp>=3.8.0",
]

[project.urls]
"homepage" = "https://github.com/ErisPulse/ErisPulse-CYOA"

[project.entry-points."erispulse.module"]
"CYOA" = "CYOA:Main"

[tool.setuptools.packages.find]
include = ["CYOA*"]
